name: Build Windows Desktop App (.exe)

on:
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub
  push:
    branches: [ master, main ]
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Python (3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Configurar Rust (Stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de dependencias Rust / Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Descargar FFmpeg estático para Windows
        shell: powershell
        run: |
          Write-Host "Descargando FFmpeg para Windows..."
          curl.exe -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          tar.exe -xf ffmpeg.zip
          $extractedFolder = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Copy-Item "$($extractedFolder.FullName)\bin\ffmpeg.exe" "backend\ffmpeg.exe"
          Copy-Item "$($extractedFolder.FullName)\bin\ffprobe.exe" "backend\ffprobe.exe"
          Write-Host "FFmpeg copiado exitosamente en backend\"

      - name: Instalar dependencias de Python (PyTorch CPU + Demucs + PyInstaller)
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          # Usar PyTorch CPU optimizado (mantiene el instalador ligero ~300MB vs 2.5GB de CUDA)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Congelar Backend con PyInstaller (drum-backend.exe)
        shell: powershell
        run: |
          cd backend
          pyinstaller --noconfirm drum_backend.spec
          cd ..
          if (-Not (Test-Path "backend\dist\drum-backend.exe")) {
            throw "Error: backend\dist\drum-backend.exe no fue generado."
          }
          Write-Host "Backend congelado con éxito."

      - name: Copiar binario a la carpeta de recursos de Tauri
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries"
          Copy-Item "backend\dist\drum-backend.exe" "src-tauri\binaries\drum-backend-x86_64-pc-windows-msvc.exe"
          Write-Host "Binario copiado a src-tauri\binaries\"

      - name: Instalar dependencias de Node.js
        run: npm install

      - name: Compilar aplicación de escritorio con Tauri
        run: npm run build

      - name: Subir instaladores de Windows (.exe y .msi) como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: DrumPractice-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publicar Release (si es un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

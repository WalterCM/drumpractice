<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#1e2230"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="drumHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3f"/>
      <stop offset="100%" stop-color="#1a1c27"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Drum Body -->
  <path d="M 96 220 C 96 290, 416 290, 416 220 L 416 350 C 416 420, 96 420, 96 350 Z" fill="#25293a" stroke="#3b4259" stroke-width="4"/>
  
  <!-- Drum Lugs -->
  <line x1="140" y1="235" x2="140" y2="365" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="245" x2="200" y2="375" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="248" x2="256" y2="378" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <line x1="312" y1="245" x2="312" y2="375" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="372" y1="235" x2="372" y2="365" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>

  <!-- Drum Head -->
  <ellipse cx="256" cy="220" rx="160" ry="60" fill="url(#drumHead)" stroke="url(#rimGrad)" stroke-width="8"/>
  <ellipse cx="256" cy="220" rx="130" ry="45" fill="none" stroke="#3f455d" stroke-dasharray="8 8" stroke-width="3"/>

  <!-- Drum Sticks -->
  <line x1="120" y1="90" x2="270" y2="230" stroke="#f1f5f9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="270" cy="230" r="10" fill="#38bdf8"/>
  <line x1="392" y1="90" x2="242" y2="230" stroke="#f1f5f9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="242" cy="230" r="10" fill="#818cf8"/>
</svg>
